<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro Guide - Metro Fares, Timings &amp; Routes</title>
<meta name="description" content="Metro fare, timing and route guides. Currently covering Chennai.">
<link rel="canonical" href="https://shikharthakur2404.github.io/metro-guide-site/">
<link rel="icon" type="image/svg+xml" href="/metro-guide-site/favicon.svg">
<meta property="og:title" content="Metro Guide - Metro Fares, Timings &amp; Routes">
<meta property="og:description" content="Metro fare, timing and route guides. Currently covering Chennai.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://shikharthakur2404.github.io/metro-guide-site/">
<meta name="robots" content="index,follow">


<style>
:root{--bg:#ffffff;--fg:#1a1a1a;--muted:#5f6368;--line:#e5e7eb;--accent:#1a73e8;--card:#f8f9fa}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg);background:var(--bg)}
header.site{padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
header.site a{color:var(--fg);text-decoration:none;font-weight:700}
main{max-width:820px;margin:0 auto;padding:20px 18px 60px}
h1{font-size:1.7rem;line-height:1.25;margin:.2em 0 .4em}
h2{font-size:1.2rem;margin:1.6em 0 .5em}
a{color:var(--accent)}
.crumb{font-size:.85rem;color:var(--muted);margin-bottom:6px}
.lead{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
.fare{display:flex;gap:24px;flex-wrap:wrap}
.fare div{min-width:120px}
.fare .big{font-size:1.9rem;font-weight:800}
.fare .lbl{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.badge{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;background:#eef;color:#114;margin-right:6px}
.leg{border-left:4px solid #ccc;padding:4px 0 4px 12px;margin:8px 0}
ol.route{margin:8px 0;padding-left:20px}
nav.links a{display:inline-block;margin:3px 10px 3px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.grid a{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--fg)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;padding:18px;max-width:820px;margin:0 auto}
.note{font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<header class="site"><a href="/metro-guide-site/">Metro Guide</a></header>
<main><h1>Metro Guide</h1><p class="lead">Fare, timing and route guides for Indian metro networks.</p><div class="grid"><a href="/metro-guide-site/chennai/">Chennai Metro</a></div></main>
<footer>Independent guide. Not affiliated with any metro operator. Fares, timings and travel times are estimates - always confirm with the operator before you travel.</footer>
</body>
</html>
